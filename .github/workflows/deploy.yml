name: Deploy to github pages
on:
    push:
        branches:
            - main
            - master
            - development  
    pull_request:
        branches:
            - main
            - master
            - development
permissions:
    contents: read
    pages: write
    id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy-to-github-pages.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4                     # v3 → v4

      - uses: pnpm/action-setup@v4                    # v2 → v4
        with:
          version: latest

      - name: Setup Node-js environment
        uses: actions/setup-node@v4                   # v3 → v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Setup pages
        uses: actions/configure-pages@v5              # v3 → v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3        # v1 → v3 (fixes your error)
        with:
          path: ./frontend/build

      - name: Deploy to github pages
        id: deploy-to-github-pages
        uses: actions/deploy-pages@v4                 # v1 → v4